---
name: Reusable C++ Native Tests

on:
  workflow_call:
    inputs:
      matrix-json:
        description: JSON array of runner OSes
        required: false
        type: string
        default: '["ubuntu-latest", "macos-latest"]'
      build-system:
        description: C++ build system (meson or cmake)
        required: false
        type: string
        default: 'meson'
      build-dir:
        description: Build output directory
        required: false
        type: string
        default: 'build'
      source-dir:
        description: Source directory containing meson.build or CMakeLists.txt
        required: false
        type: string
        default: '.'
      install-netsnmp:
        description: Install Net-SNMP and OpenSSL dependencies before building
        required: false
        type: boolean
        default: true
      start-snmpd:
        description: Start snmpd test daemon using configs/snmpd.conf
        required: false
        type: boolean
        default: false
      pre-build-cmd:
        description: Optional shell command to run before configuring/building
        required: false
        type: string
        default: ''
      test-command:
        description: Optional custom test command override
        required: false
        type: string
        default: ''
      upload-codecov:
        description: Upload coverage and test results to Codecov
        required: false
        type: boolean
        default: true
      codecov-flags:
        description: Codecov upload flags
        required: false
        type: string
        default: 'cpp-native'
      coverage-files:
        description: Comma-separated coverage files for Codecov
        required: false
        type: string
        default: './build/meson-logs/coverage.xml,./coverage.xml'
      junit-files:
        description: JUnit XML test result file glob for Codecov and artifacts
        required: false
        type: string
        default: './build/meson-logs/testlog.junit.xml'
    secrets:
      codecov-token:
        description: Optional Codecov upload token
        required: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Run C++ Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.matrix-json) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Net-SNMP and build dependencies
        if: inputs.install-netsnmp
        uses: carlkidcrypto/os-specific-runner@8bf8551e08c48d9b72f768392e692fad5bb169e7  # v2.5.0
        with:
          linux: |
            sudo apt-get update
            sudo apt-get install -y build-essential meson ninja-build cmake pkg-config \
              libsnmp-dev libperl-dev libssl-dev libgtest-dev lcov gcovr snmpd
            sudo systemctl stop snmpd || true
          macos: |
            brew install net-snmp openssl@3 meson ninja cmake googletest lcov

      - name: Run pre-build command
        if: inputs.pre-build-cmd != ''
        run: ${{ inputs.pre-build-cmd }}

      - name: Start SNMP daemon
        if: inputs.start-snmpd
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PATH="$(brew --prefix net-snmp)/bin:$(brew --prefix net-snmp)/sbin:$PATH"
          fi
          SNMPD=$(command -v snmpd)
          "$SNMPD" -C -c configs/snmpd.conf -r -Le -m ALL
          for attempt in $(seq 1 15); do
            if snmpget -v2c -c public -t 1 -r 0 udp:127.0.0.1:11161 .1.3.6.1.2.1.1.1.0 >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "SNMP daemon did not become ready on 127.0.0.1:11161" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Configure, build, and run C++ tests
        env:
          BUILD_SYSTEM: ${{ inputs.build-system }}
          BUILD_DIR: ${{ inputs.build-dir }}
          SOURCE_DIR: ${{ inputs.source-dir }}
          TEST_COMMAND: ${{ inputs.test-command }}
          UPLOAD_CODECOV: ${{ inputs.upload-codecov }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PKG_CONFIG_PATH="$(brew --prefix net-snmp)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            export PATH="$(brew --prefix net-snmp)/bin:$(brew --prefix net-snmp)/sbin:$PATH"
          fi

          case "$BUILD_SYSTEM" in
            meson)
              COVERAGE_OPT=""
              if [ "$UPLOAD_CODECOV" = "true" ] && [ "$RUNNER_OS" = "Linux" ]; then
                COVERAGE_OPT="-Db_coverage=true"
              fi
              meson setup "$BUILD_DIR" "$SOURCE_DIR" $COVERAGE_OPT
              meson compile -C "$BUILD_DIR"
              if [ -n "$TEST_COMMAND" ]; then
                eval "$TEST_COMMAND"
              else
                meson test -C "$BUILD_DIR" --print-errorlogs
              fi
              ;;
            cmake)
              cmake -S "$SOURCE_DIR" -B "$BUILD_DIR" -G Ninja
              cmake --build "$BUILD_DIR"
              if [ -n "$TEST_COMMAND" ]; then
                eval "$TEST_COMMAND"
              else
                ctest --test-dir "$BUILD_DIR" --output-on-failure
              fi
              ;;
            *)
              echo "Unsupported build-system: ${BUILD_SYSTEM} (expected 'meson' or 'cmake')" >&2
              exit 1
              ;;
          esac

      - name: Upload C++ coverage to Codecov
        if: always() && inputs.upload-codecov && runner.os == 'Linux'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.codecov-token }}
          files: ${{ inputs.coverage-files }}
          flags: ${{ inputs.codecov-flags }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.codecov-token }}

      - name: Upload C++ test results to Codecov
        if: always() && inputs.upload-codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.codecov-token }}
          files: ${{ inputs.junit-files }}
          flags: ${{ inputs.codecov-flags }}
          report_type: test_results
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.codecov-token }}

      - name: Upload C++ test results artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v5
        with:
          name: cpp-test-results-${{ matrix.os }}
          path: ${{ inputs.junit-files }}
          if-no-files-found: ignore
