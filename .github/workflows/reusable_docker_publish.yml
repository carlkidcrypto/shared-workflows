---
name: Reusable Docker Publish

on:
  workflow_call:
    inputs:
      docker-repo:
        description: Optional Docker Hub repository slug (e.g. owner/image)
        required: false
        type: string
        default: ''
      ghcr-repo:
        description: Optional GHCR repository slug (e.g. ghcr.io/owner/image)
        required: false
        type: string
        default: ''
      context:
        description: Docker build context path
        required: false
        type: string
        default: '.'
      dockerfile:
        description: Path to Dockerfile
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: Optional comma-separated target platforms (e.g. linux/amd64,linux/arm64)
        required: false
        type: string
        default: ''
      push:
        description: Whether to push built images to configured registries
        required: false
        type: boolean
        default: true
      tags:
        description: Optional newline-separated image tags (auto-generated from registries when empty)
        required: false
        type: string
        default: ''
      labels:
        description: Optional newline-separated OCI image labels
        required: false
        type: string
        default: ''
      build-args:
        description: Optional newline-separated Docker build-args
        required: false
        type: string
        default: ''
      cache-scope:
        description: GitHub Actions Buildx cache scope
        required: false
        type: string
        default: 'docker'
      timeout-minutes:
        description: Job timeout in minutes
        required: false
        type: number
        default: 120
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub username (required when docker-repo is set and push is true)
        required: false
      DOCKERHUB_TOKEN:
        description: Docker Hub access token (required when docker-repo is set and push is true)
        required: false

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: write
    env:
      HAS_DOCKERHUB_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Docker Hub
        if: ${{ inputs.push && inputs.docker-repo != '' && env.HAS_DOCKERHUB_CREDS == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push && inputs.ghcr-repo != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        env:
          INPUT_TAGS: ${{ inputs.tags }}
          DOCKER_REPO: ${{ inputs.docker-repo }}
          GHCR_REPO: ${{ inputs.ghcr-repo }}
        run: |
          set -euo pipefail
          {
            echo "docker_tags<<EOF"
            if [ -n "${INPUT_TAGS}" ]; then
              printf '%s\n' "${INPUT_TAGS}"
            else
              short_sha="${GITHUB_SHA::12}"
              ref_tag="${GITHUB_REF_NAME//\//-}"
              if [ -n "${DOCKER_REPO}" ]; then
                echo "${DOCKER_REPO}:${ref_tag}-${short_sha}"
              fi
              if [ -n "${GHCR_REPO}" ]; then
                echo "${GHCR_REPO}:${ref_tag}-${short_sha}"
              fi
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          pull: true
          tags: ${{ steps.tags.outputs.docker_tags }}
          labels: ${{ inputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha,scope=${{ inputs.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
