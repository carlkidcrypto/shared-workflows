---
name: Reusable Verify Syntax

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for yamllint
        required: false
        type: string
        default: '3.14'
      yamllint-version:
        description: yamllint version
        required: false
        type: string
        default: '1.38.0'
      actionlint-version:
        description: actionlint release tag
        required: false
        type: string
        default: 'v1.7.12'
      exclude-lock-yml:
        description: Exclude gh-aw *.lock.yml and agentics-maintenance.yml
        required: false
        type: boolean
        default: true
      run-shellcheck:
        description: Run shellcheck via actionlint
        required: false
        type: boolean
        default: true
      run-gh-aw:
        description: Validate gh-aw markdown workflows with gh aw compile --validate
        required: false
        type: boolean
        default: false
      gh-aw-version:
        description: gh-aw CLI extension release tag
        required: false
        type: string
        default: 'v0.89.21'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install yamllint
        run: python -m pip install --only-binary ":all:" "yamllint==${{ inputs.yamllint-version }}"
      - name: Setup actionlint
        uses: carlkidcrypto/shared-workflows/actions/setup-actionlint@5513565543c092bae6473245135f702332d75a30
        with:
          version: ${{ inputs.actionlint-version }}
      - name: Install gh-aw extension
        if: ${{ inputs.run-gh-aw }}
        uses: github/gh-aw-actions/setup-cli@dfe97a19c8249d41e2adfc95f92db2b8facea58f  # v1.3.1
        with:
          version: ${{ inputs.gh-aw-version }}
      - name: Run yamllint & actionlint
        env:
          EXCLUDE_LOCK: ${{ inputs.exclude-lock-yml }}
          RUN_SHELLCHECK: ${{ inputs.run-shellcheck }}
        run: |
          set -euo pipefail
          if [ "$EXCLUDE_LOCK" = "true" ]; then
            FILES=$(find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \) \
              ! -name "*.lock.yml" ! -name "*.lock.yaml" ! -name "agentics-maintenance.yml")
          else
            FILES=$(find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \))
          fi
          if [ -z "$FILES" ]; then
            echo "No workflow files to lint."
            exit 0
          fi
          echo "$FILES" | xargs -d '\n' yamllint -c .yamllint
          if [ "$RUN_SHELLCHECK" = "true" ]; then
            echo "$FILES" | xargs -d '\n' actionlint
          else
            echo "$FILES" | xargs -d '\n' actionlint -shellcheck=
          fi
      - name: Validate gh-aw workflows
        if: ${{ inputs.run-gh-aw }}
        run: |
          set -euo pipefail
          if compgen -G ".github/workflows/*.md" > /dev/null; then
            gh aw compile --validate
          else
            echo "No gh-aw markdown workflows found."
          fi
