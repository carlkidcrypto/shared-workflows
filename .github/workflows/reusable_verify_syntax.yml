---
name: Reusable Verify Syntax

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for yamllint
        required: false
        type: string
        default: '3.14'
      yamllint-version:
        description: yamllint version
        required: false
        type: string
        default: '1.38.0'
      actionlint-version:
        description: actionlint release tag
        required: false
        type: string
        default: 'v1.7.12'
      exclude-lock-yml:
        description: Exclude gh-aw *.lock.yml and agentics-maintenance.yml
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install yamllint
        run: python -m pip install --only-binary ":all:" "yamllint==${{ inputs.yamllint-version }}"
      - name: Setup actionlint
        uses: carlkidcrypto/shared-workflows/actions/setup-actionlint@815d697f05f093181374ff84b28757cb8ff468b3
        with:
          version: ${{ inputs.actionlint-version }}
      - name: Run yamllint & actionlint
        env:
          EXCLUDE_LOCK: ${{ inputs.exclude-lock-yml }}
        run: |
          set -euo pipefail
          if [ "$EXCLUDE_LOCK" = "true" ]; then
            FILES=$(find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \) \
              ! -name "*.lock.yml" ! -name "*.lock.yaml" ! -name "agentics-maintenance.yml")
          else
            FILES=$(find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \))
          fi
          if [ -z "$FILES" ]; then
            echo "No workflow files to lint."
            exit 0
          fi
          echo "$FILES" | xargs -d '\n' yamllint -c .yamllint
          echo "$FILES" | xargs -d '\n' actionlint -shellcheck=
