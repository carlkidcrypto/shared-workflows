---
name: Reusable PyPI Publish

on:
  workflow_call:
    inputs:
      target:
        description: Target PyPI registry ('pypi' or 'testpypi')
        required: false
        type: string
        default: 'testpypi'
      environment-name:
        description: GitHub Actions deployment environment name (optional)
        required: false
        type: string
        default: ''
      build-mode:
        description: Build mode ('cibuildwheel' or 'pure-python')
        required: false
        type: string
        default: 'cibuildwheel'
      package-subdir:
        description: Subdirectory containing the Python package (e.g. '.' or 'python/')
        required: false
        type: string
        default: '.'
      matrix-json:
        description: JSON array of wheel build matrix entries
        required: false
        type: string
        default: >-
          [{"os":"ubuntu-latest","arch":"x86_64","label":"x86_64-manylinux","cibw-build":"*-manylinux*"},{"os":"ubuntu-latest","arch":"x86_64","label":"x86_64-musllinux","cibw-build":"*-musllinux*"},{"os":"macos-latest","arch":"arm64"},{"os":"windows-latest","arch":"AMD64"},{"os":"windows-latest","arch":"x86"},{"os":"windows-latest","arch":"ARM64"}]
      use-local-wheel-action:
        description: Use caller repository ./.github/actions/build-wheels composite action instead of inline cibuildwheel
        required: false
        type: boolean
        default: false
      cibuildwheel-version:
        description: cibuildwheel version to install when use-local-wheel-action is false
        required: false
        type: string
        default: '2.22.0'
      python-version:
        description: Python version for building sdist and running cibuildwheel
        required: false
        type: string
        default: '3.11'
      run-verify-syntax:
        description: Whether to run reusable_verify_syntax before building
        required: false
        type: boolean
        default: true
      check-changes:
        description: Whether to gate builds on changed-files-patterns (bypassed on workflow_dispatch/release)
        required: false
        type: boolean
        default: false
      changed-files-patterns:
        description: Newline-delimited file patterns for tj-actions/changed-files
        required: false
        type: string
        default: ''
      third-party-repo:
        description: Optional third-party repository to checkout (e.g. carlkidcrypto/ezsnmp)
        required: false
        type: string
        default: ''
      third-party-ref:
        description: Git ref for third-party-repo checkout
        required: false
        type: string
        default: ''
      third-party-path:
        description: Destination path for third-party-repo checkout
        required: false
        type: string
        default: ''
      sdist-setup-cmd:
        description: Optional shell command to run before building sdist
        required: false
        type: string
        default: ''
      skip-existing:
        description: Skip uploading distributions that already exist on the target registry
        required: false
        type: boolean
        default: true
      verify-metadata:
        description: Verify package metadata before uploading
        required: false
        type: boolean
        default: false
      artifact-retention-days:
        description: Retention days for uploaded wheel and sdist artifacts
        required: false
        type: number
        default: 7
    secrets:
      pypi-token:
        description: Optional PyPI API token fallback (leave unset to use OIDC Trusted Publishing)
        required: false

permissions:
  contents: read

jobs:
  verify-syntax:
    if: ${{ inputs.run-verify-syntax }}
    permissions:
      contents: read
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_verify_syntax.yml@88de7dd78ef1a992d2509818afcf0c76a2c631eb

  check-source-changes:
    needs: verify-syntax
    if: ${{ always() && (needs.verify-syntax.result == 'success' || needs.verify-syntax.result == 'skipped') && inputs.check-changes }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for packaging and source changes
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: ${{ inputs.changed-files-patterns }}

  build-wheels:
    needs: [verify-syntax, check-source-changes]
    if: >-
      ${{ always() &&
      (needs.verify-syntax.result == 'success' || needs.verify-syntax.result == 'skipped') &&
      inputs.build-mode == 'cibuildwheel' &&
      (!inputs.check-changes || needs.check-source-changes.outputs.run_job == 'true' ||
      github.event_name == 'workflow_dispatch' || github.event_name == 'release') }}
    name: Build wheels on ${{ matrix.os }} (${{ matrix.label || matrix.arch || matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix-json) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout third-party dependency
        if: ${{ inputs.third-party-repo != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.third-party-repo }}
          ref: ${{ inputs.third-party-ref }}
          path: ${{ inputs.third-party-path }}

      - name: Build and upload wheels via local composite action
        if: ${{ inputs.use-local-wheel-action }}
        uses: ./.github/actions/build-wheels
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch || '' }}
          job-index: ${{ strategy.job-index }}
          cibw-build: ${{ matrix.cibw-build || '*' }}
          label: ${{ matrix.label || matrix.arch || matrix.os }}

      - name: Set up Python
        if: ${{ !inputs.use-local-wheel-action }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install cibuildwheel
        if: ${{ !inputs.use-local-wheel-action }}
        shell: bash
        run: |
          python -m pip install --only-binary ":all:" "cibuildwheel==${{ inputs.cibuildwheel-version }}"

      - name: Build wheels with cibuildwheel
        if: ${{ !inputs.use-local-wheel-action }}
        shell: bash
        env:
          CIBW_BUILD: ${{ matrix.cibw-build || '*' }}
        run: python -m cibuildwheel "${{ inputs.package-subdir }}" --output-dir dist/

      - name: Upload wheel artifacts
        if: ${{ !inputs.use-local-wheel-action }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.arch || matrix.os }}-${{ strategy.job-index }}
          path: dist/*.whl
          retention-days: ${{ inputs.artifact-retention-days }}

  build-sdist:
    needs: [verify-syntax, check-source-changes]
    if: >-
      ${{ always() &&
      (needs.verify-syntax.result == 'success' || needs.verify-syntax.result == 'skipped') &&
      (!inputs.check-changes || needs.check-source-changes.outputs.run_job == 'true' ||
      github.event_name == 'workflow_dispatch' || github.event_name == 'release') }}
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout third-party dependency
        if: ${{ inputs.third-party-repo != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.third-party-repo }}
          ref: ${{ inputs.third-party-ref }}
          path: ${{ inputs.third-party-path }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run sdist setup command
        if: ${{ inputs.sdist-setup-cmd != '' }}
        shell: bash
        run: ${{ inputs.sdist-setup-cmd }}

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --only-binary :all: --upgrade pip
          python -m pip install --only-binary :all: build==1.2.2.post1

      - name: Build distribution
        shell: bash
        run: |
          if [ "${{ inputs.build-mode }}" = "pure-python" ]; then
            python -m build --sdist --wheel "${{ inputs.package-subdir }}" --outdir dist/
          else
            python -m build --sdist "${{ inputs.package-subdir }}" --outdir dist/
          fi

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sdist
          path: dist/*
          retention-days: ${{ inputs.artifact-retention-days }}

  publish:
    needs: [build-wheels, build-sdist]
    if: >-
      ${{ always() &&
      needs.build-sdist.result == 'success' &&
      (needs.build-wheels.result == 'success' || needs.build-wheels.result == 'skipped') }}
    name: Publish distribution to ${{ inputs.target == 'testpypi' && 'TestPyPI' || 'PyPI' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}
    permissions:
      id-token: write
      contents: read
    env:
      PYPI_TOKEN: ${{ secrets.pypi-token }}
    steps:
      - name: Download wheel artifacts
        if: ${{ inputs.build-mode == 'cibuildwheel' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: cibw-wheels-*
          merge-multiple: true
          path: dist/

      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sdist
          path: dist/

      - name: Publish distribution to ${{ inputs.target == 'testpypi' && 'TestPyPI' || 'PyPI' }} (API token)
        if: ${{ env.PYPI_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1.14
        with:
          packages-dir: dist/
          password: ${{ secrets.pypi-token }}
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
          skip-existing: ${{ inputs.skip-existing }}
          verify-metadata: ${{ inputs.verify-metadata }}
          print-hash: true

      - name: Publish distribution to ${{ inputs.target == 'testpypi' && 'TestPyPI' || 'PyPI' }} (OIDC)
        if: ${{ env.PYPI_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1.14
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.target == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
          skip-existing: ${{ inputs.skip-existing }}
          verify-metadata: ${{ inputs.verify-metadata }}
          print-hash: true
