---
name: Reusable Python Tests

on:
  workflow_call:
    inputs:
      os-list:
        description: JSON array of runner OS labels
        required: false
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      python-versions:
        description: JSON array of Python versions to test
        required: false
        type: string
        default: '["3.13", "3.14"]'
      requirements-file:
        description: Path to requirements file to install if present
        required: false
        type: string
        default: 'requirements.txt'
      setup-cmd:
        description: Optional bash setup command run before installing package and running tests
        required: false
        type: string
        default: ''
      install-cmd:
        description: Command to install dependencies and the package
        required: false
        type: string
        default: 'python -m pip install -e .'
      test-cmd:
        description: Command to run pytest and produce coverage/test reports
        required: false
        type: string
        default: 'pytest --cov=. --cov-report=xml:coverage.xml --junitxml=test-results.xml'
      upload-codecov:
        description: Whether to upload coverage to Codecov
        required: false
        type: boolean
        default: true
      coverage-file:
        description: Path to coverage XML file
        required: false
        type: string
        default: 'coverage.xml'
      coverage-flags:
        description: Comma-separated Codecov flags for coverage upload
        required: false
        type: string
        default: 'python_code'
      upload-test-results:
        description: Whether to upload JUnit test results to Codecov
        required: false
        type: boolean
        default: false
      test-results-file:
        description: Path to JUnit XML test results file
        required: false
        type: string
        default: 'test-results.xml'
      third-party-repo:
        description: Optional third-party repository to checkout
        required: false
        type: string
        default: ''
      third-party-ref:
        description: Git ref for third-party-repo checkout
        required: false
        type: string
        default: ''
      third-party-path:
        description: Destination path for third-party-repo checkout
        required: false
        type: string
        default: ''
      run-verify-syntax:
        description: Whether to run reusable_verify_syntax before testing
        required: false
        type: boolean
        default: true
      check-changes:
        description: Whether to gate execution on changed-files-patterns (bypassed on workflow_dispatch)
        required: false
        type: boolean
        default: true
      changed-files-patterns:
        description: Newline-delimited file patterns for tj-actions/changed-files
        required: false
        type: string
        default: |
          **/*.py
          pyproject.toml
          setup.py
          setup.cfg
          requirements.txt
          codecov.yml
    secrets:
      CODECOV_TOKEN:
        description: Codecov upload token
        required: false

permissions:
  contents: read

jobs:
  verify-syntax:
    if: ${{ inputs.run-verify-syntax }}
    permissions:
      contents: read
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_verify_syntax.yml@88de7dd78ef1a992d2509818afcf0c76a2c631eb

  check-source-changes:
    needs: verify-syntax
    if: ${{ always() && (needs.verify-syntax.result == 'success' || needs.verify-syntax.result == 'skipped') && inputs.check-changes }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for changes in Python source or tests
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: ${{ inputs.changed-files-patterns }}

  python-tests:
    needs: [verify-syntax, check-source-changes]
    if: >-
      ${{ always() &&
      (needs.verify-syntax.result == 'success' || needs.verify-syntax.result == 'skipped') &&
      (!inputs.check-changes || needs.check-source-changes.outputs.run_job == 'true' ||
      github.event_name == 'workflow_dispatch') }}
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-list) }}
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout third-party dependency
        if: ${{ inputs.third-party-repo != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.third-party-repo }}
          ref: ${{ inputs.third-party-ref }}
          path: ${{ inputs.third-party-path }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run optional setup command
        if: ${{ inputs.setup-cmd != '' }}
        shell: bash
        env:
          SETUP_CMD: ${{ inputs.setup-cmd }}
        run: |
          eval "${SETUP_CMD}"

      - name: Install dependencies and package
        shell: bash
        env:
          REQ_FILE: ${{ inputs.requirements-file }}
          INSTALL_CMD: ${{ inputs.install-cmd }}
        run: |
          python -m pip install --upgrade pip
          if [ -f "${REQ_FILE}" ]; then
            pip install -r "${REQ_FILE}"
          fi
          eval "${INSTALL_CMD}"

      - name: Run Python test suite
        shell: bash
        env:
          TEST_CMD: ${{ inputs.test-cmd }}
        run: |
          eval "${TEST_CMD}"

      - name: Upload coverage to Codecov
        if: ${{ inputs.upload-codecov && env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574  # v5.4.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ inputs.coverage-file }}
          flags: ${{ inputs.coverage-flags }}
          name: python-${{ matrix.python-version }}-${{ matrix.os }}
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ always() && inputs.upload-test-results && env.HAS_CODECOV_TOKEN == 'true' }}
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574  # v5.4.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ inputs.test-results-file }}
          report_type: test_results
          name: python-results-${{ matrix.python-version }}-${{ matrix.os }}
          fail_ci_if_error: false
