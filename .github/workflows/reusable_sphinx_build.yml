---
name: Reusable Sphinx Build

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version (3.13+ required for Sphinx 9.2+)
        required: false
        type: string
        default: '3.14'
      docs-dir:
        description: Sphinx docs directory
        required: false
        type: string
        default: 'sphinx_docs_build'
      requirements-file:
        description: Sphinx requirements.txt path
        required: false
        type: string
        default: 'sphinx_docs_build/requirements.txt'
      output-dir:
        description: Built HTML output directory
        required: false
        type: string
        default: 'docs'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sphinx-${{ hashFiles(inputs.requirements-file) }}
          restore-keys: |
            ${{ runner.os }}-pip-sphinx-
      - name: Install Sphinx dependencies
        run: python -m pip install -r "${{ inputs.requirements-file }}"
      - name: Build Sphinx HTML
        run: |
          sphinx-build -b html "${{ inputs.docs-dir }}/source" "${{ inputs.output-dir }}"
          touch "${{ inputs.output-dir }}/.nojekyll"
