---
name: Reusable Python Black Check

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        required: false
        type: string
        default: '3.14'
      black-version:
        description: Black formatter version
        required: false
        type: string
        default: '26.3.1'
      target-paths:
        description: Space-separated paths for black --check
        required: false
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install black
        run: python -m pip install --only-binary ":all:" "black==${{ inputs.black-version }}"
      - name: Run black --check
        run: black --check --diff ${{ inputs.target-paths }}
