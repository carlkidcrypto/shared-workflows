---
name: Reusable Python Black Check

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        required: false
        type: string
        default: '3.14'
      black-version:
        description: Black formatter version
        required: false
        type: string
        default: '26.3.1'
      target-paths:
        description: Space-separated paths for black --check
        required: false
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install black
        run: python -m pip install --only-binary ":all:" "black==${{ inputs.black-version }}"
      - name: Run black --check
        run: black --check --diff ${{ inputs.target-paths }}
